name: CI

on:
  push:
    branches: [ dev, main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify
        run: mvn -B verify
      - name: Build fat jar
        run: mvn -B package -DskipTests
      - name: Docker smoke test
        run: ./scripts/docker-smoke-test.sh intranet-mail-kotlin:ci
