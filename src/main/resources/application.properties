server.address=${mail.http-host:0.0.0.0}
server.port=${mail.http-port:8080}
spring.datasource.url=${mail.h2-url:jdbc:h2:./data/intranet-mail;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${mail.h2-user:sa}
spring.datasource.password=${mail.h2-password:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.jackson.serialization.indent-output=true
