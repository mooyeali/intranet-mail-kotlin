<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Admin Login</title>
    <style>
        body { margin:0; min-height:100vh; display:grid; place-items:center; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:linear-gradient(135deg,#eff6ff,#fff7ed); color:#0f172a; }
        .card { width:min(440px, calc(100vw - 32px)); background:white; border:1px solid #dbe3ef; border-radius:24px; padding:32px; box-shadow:0 18px 48px #1e293b1f; }
        h1 { margin:0 0 12px; }
        p { color:#64748b; line-height:1.6; }
        label { display:block; margin:16px 0 6px; font-weight:700; }
        input { width:100%; box-sizing:border-box; border:1px solid #cbd5e1; border-radius:12px; padding:12px 14px; font:inherit; }
        button { width:100%; margin-top:20px; border:0; border-radius:12px; padding:12px 16px; background:#2563eb; color:white; font-weight:800; cursor:pointer; }
        code { background:#f1f5f9; border-radius:8px; padding:3px 6px; }
    </style>
</head>
<body>
<div class="card">
    <h1>Admin Login</h1>
    <p>Sign in to create a signed admin session. Header-token API access remains available through <code>X-Admin-Token</code>.</p>
    <form method="post" th:action="${loginEndpoint}">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
    </form>
</div>
</body>
</html>
